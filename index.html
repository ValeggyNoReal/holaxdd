<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows XP / 95 Retro OS</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: "Tahoma", "MS Sans Serif", Geneva, sans-serif;
            font-size: 11px;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            /* Fondo Colina Verde / Bliss */
            background: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%(location%).png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Ventanas Estilo Windows Retro --- */
        .window {
            position: absolute;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 3px 6px;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .title-bar-controls button {
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 10px;
            padding: 0;
            margin-left: 2px;
            background: #c0c0c0;
            border: 1px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            cursor: pointer;
            font-weight: bold;
        }

        .title-bar-controls button:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .window-body {
            padding: 4px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* --- Menú Superior --- */
        .menu-bar {
            display: flex;
            gap: 10px;
            background: #c0c0c0;
            padding: 2px 4px;
            border-bottom: 1px solid #808080;
            margin-bottom: 4px;
        }

        .menu-item {
            cursor: pointer;
        }

        /* --- Estilos Paint --- */
        #paint-window {
            top: 40px;
            left: 40px;
            width: 620px;
            height: 480px;
        }

        .paint-workspace {
            display: flex;
            flex-grow: 1;
            gap: 4px;
            height: calc(100% - 60px);
        }

        .paint-tools {
            width: 56px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: #c0c0c0;
        }

        .tool-btn {
            width: 25px;
            height: 25px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .tool-btn.active {
            border-color: #808080 #ffffff #ffffff #808080;
            background: #e0e0e0;
        }

        .canvas-container {
            flex-grow: 1;
            background: #808080;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            overflow: auto;
            padding: 3px;
        }

        #paintCanvas {
            background: white;
            cursor: crosshair;
            display: block;
        }

        .paint-palette {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            background: #c0c0c0;
            padding: 3px;
            border: 1px solid #808080;
        }

        .color-box {
            width: 14px;
            height: 14px;
            border: 1px solid #000;
            cursor: pointer;
        }

        /* --- Estilos Reproductor de Video --- */
        #media-window {
            top: 60px;
            left: 700px;
            width: 420px;
            height: 360px;
        }

        .video-container {
            background: #000;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .media-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 2px 0;
        }

        /* --- Estilos Juegos --- */
        #games-window {
            top: 200px;
            left: 300px;
            width: 280px;
            height: 320px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #808080;
            width: 180px;
            height: 180px;
            margin: 10px auto;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .cell {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell.pressed {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        /* --- Barra de Tareas --- */
        .taskbar {
            height: 30px;
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            display: flex;
            align-items: center;
            padding: 2px;
            z-index: 100;
        }

        .start-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 2px 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .start-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .taskbar-items {
            display: flex;
            gap: 4px;
            margin-left: 10px;
        }

        .task-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="window" id="paint-window">
        <div class="title-bar">
            <span>Paint - Sin título</span>
            <div class="title-bar-controls">
                <button onclick="toggleWindow('paint-window')">X</button>
            </div>
        </div>
        <div class="menu-bar">
            <span class="menu-item">Archivo</span>
            <span class="menu-item">Edición</span>
            <span class="menu-item">Ver</span>
            <span class="menu-item">Imagen</span>
            <span class="menu-item" onclick="clearCanvas()">Limpiar</span>
        </div>
        <div class="window-body">
            <div class="paint-workspace">
                <div class="paint-tools">
                    <button class="tool-btn active" title="Lápiz" onclick="setTool('pencil')">✏️</button>
                    <button class="tool-btn" title="Borrador" onclick="setTool('eraser')">🧽</button>
                    <button class="tool-btn" title="Pincel" onclick="setTool('brush')">🖌️</button>
                    <button class="tool-btn" title="Relleno" onclick="setTool('bucket')">🪣</button>
                    <button class="tool-btn" title="Línea" onclick="setTool('line')">➖</button>
                    <button class="tool-btn" title="Rectángulo" onclick="setTool('rect')">🔲</button>
                </div>
                <div class="canvas-container">
                    <canvas id="paintCanvas" width="500" height="350"></canvas>
                </div>
            </div>
            <div class="paint-palette">
                <span>Color:</span>
                <input type="color" id="colorPicker" value="#000000" onchange="currentColor = this.value">
                <span>Grosor:</span>
                <select id="brushSize" onchange="currentSize = this.value">
                    <option value="1">1px</option>
                    <option value="3" selected>3px</option>
                    <option value="5">5px</option>
                    <option value="10">10px</option>
                </select>
                <div class="color-box" style="background: black;" onclick="setColor('#000000')"></div>
                <div class="color-box" style="background: red;" onclick="setColor('#ff0000')"></div>
                <div class="color-box" style="background: green;" onclick="setColor('#00ff00')"></div>
                <div class="color-box" style="background: blue;" onclick="setColor('#0000ff')"></div>
                <div class="color-box" style="background: yellow;" onclick="setColor('#ffff00')"></div>
                <div class="color-box" style="background: white;" onclick="setColor('#ffffff')"></div>
            </div>
        </div>
    </div>

    <div class="window" id="media-window">
        <div class="title-bar">
            <span>Reproductor Retro Media Player</span>
            <div class="title-bar-controls">
                <button onclick="toggleWindow('media-window')">X</button>
            </div>
        </div>
        <div class="window-body">
            <div class="video-container">
                <iframe id="videoPlayer" src="https://www.youtube.com/embed/ZUyVdlBAmms" allowfullscreen></iframe>
            </div>
            <div class="media-controls">
                <button onclick="prevVideo()">⏮️ Anterior</button>
                <select id="videoSelect" onchange="changeVideo(this.value)">
                    <option value="0">Video 1 (Playlist Item)</option>
                    <option value="1">Video 2 (Super Mario 64)</option>
                    <option value="2">Video 3</option>
                    <option value="3">Video 4 (Roblox Classic)</option>
                </select>
                <button onclick="nextVideo()">Siguiente ⏭️</button>
            </div>
        </div>
    </div>

    <div class="window" id="games-window">
        <div class="title-bar">
            <span>Juegos Retro - Tres en Raya</span>
            <div class="title-bar-controls">
                <button onclick="toggleWindow('games-window')">X</button>
            </div>
        </div>
        <div class="window-body">
            <div style="text-align: center; margin-bottom: 5px;">
                <span id="gameStatus">Turno de: X</span>
                <button onclick="resetGame()" style="margin-left: 10px;">Reiniciar</button>
            </div>
            <div class="game-board" id="board">
                <div class="cell" onclick="makeMove(this, 0)"></div>
                <div class="cell" onclick="makeMove(this, 1)"></div>
                <div class="cell" onclick="makeMove(this, 2)"></div>
                <div class="cell" onclick="makeMove(this, 3)"></div>
                <div class="cell" onclick="makeMove(this, 4)"></div>
                <div class="cell" onclick="makeMove(this, 5)"></div>
                <div class="cell" onclick="makeMove(this, 6)"></div>
                <div class="cell" onclick="makeMove(this, 7)"></div>
                <div class="cell" onclick="makeMove(this, 8)"></div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <button class="start-btn">🪟 <b>Inicio</b></button>
        <div class="taskbar-items">
            <button class="task-btn" onclick="toggleWindow('paint-window')">🎨 Paint</button>
            <button class="task-btn" onclick="toggleWindow('media-window')">🎬 Reproductor</button>
            <button class="task-btn" onclick="toggleWindow('games-window')">🎮 Juegos</button>
        </div>
    </div>

    <script>
        // --- Control de Ventanas ---
        function toggleWindow(id) {
            const win = document.getElementById(id);
            win.style.display = (win.style.display === 'none') ? 'flex' : 'none';
        }

        // --- Lógica del Paint ---
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentTool = 'pencil';
        let currentColor = '#000000';
        let currentSize = 3;

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';

            if (currentTool === 'pencil' || currentTool === 'brush') {
                ctx.strokeStyle = currentColor;
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (currentTool === 'eraser') {
                ctx.strokeStyle = '#ffffff';
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (currentTool === 'bucket') {
                ctx.fillStyle = currentColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function setColor(color) {
            currentColor = color;
            document.getElementById('colorPicker').value = color;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);

        // --- Lógica del Reproductor de Video ---
        const playlist = [
            "https://www.youtube.com/embed/ZUyVdlBAmms",
            "https://www.youtube.com/embed/W-MrhVPEqRo",
            "https://www.youtube.com/embed/u-dSZNFiBD0",
            "https://www.youtube.com/embed/kqKtILIu6ak"
        ];
        let currentVideoIndex = 0;

        function changeVideo(index) {
            currentVideoIndex = parseInt(index);
            document.getElementById('videoPlayer').src = playlist[currentVideoIndex];
            document.getElementById('videoSelect').value = currentVideoIndex;
        }

        function nextVideo() {
            currentVideoIndex = (currentVideoIndex + 1) % playlist.length;
            changeVideo(currentVideoIndex);
        }

        function prevVideo() {
            currentVideoIndex = (currentVideoIndex - 1 + playlist.length) % playlist.length;
            changeVideo(currentVideoIndex);
        }

        // --- Lógica Juego Tres en Raya ---
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;

        function makeMove(cell, index) {
            if (boardState[index] !== "" || !gameActive) return;
            
            boardState[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add('pressed');

            if (checkWin()) {
                document.getElementById('gameStatus').innerText = `¡Ganador: ${currentPlayer}!`;
                gameActive = false;
                return;
            }

            if (!boardState.includes("")) {
                document.getElementById('gameStatus').innerText = "¡Empate!";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById('gameStatus').innerText = `Turno de: ${currentPlayer}`;
        }

        function checkWin() {
            const winConditions = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winConditions.some(condition => {
                return condition.every(index => boardState[index] === currentPlayer);
            });
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;
            document.getElementById('gameStatus').innerText = "Turno de: X";
            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('pressed');
            });
        }
    </script>
</body>
</html>
